<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Content Mate — Content System Manager</title>
  
  <!-- SEO & Meta Tags -->
  <meta name="description" content="Content Mate is a content system manager for planning, creating, and publishing content.">
  <meta name="theme-color" content="#FBFBFA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18181B" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23EAF7FF'/%3E%3Cpath d='M25 17v30l24-15z' fill='%232582D7'/%3E%3C/svg%3E">
  
  <!-- Typography (Inter / SF Pro aesthetic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- App Container -->
  <div id="app" class="app-wrapper">
    
    <!-- Desktop / Tablet Sidebar (Hidden on mobile) -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-brand">
        <div class="brand-badge">
          <img class="content-mate-logo" src="Screenshot%202026-08-16%20105828.png" alt="Content Mate logo">
        </div>
        <div class="brand-text">
          <span class="brand-title">Content Mate</span>
          <span class="brand-subtitle" id="sidebar-dr-name">Dr. Workspace</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-link active" data-view="dashboard" id="nav-d-dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Today</span>
          <span class="nav-badge hidden" id="badge-today-count">0</span>
        </a>

        <a href="#review" class="nav-link" data-view="review" id="nav-d-review">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20M2 6h20M2 18h20"/><circle cx="7" cy="6" r="2"/><circle cx="17" cy="12" r="2"/><circle cx="7" cy="18" r="2"/></svg>
          <span>Script Review</span>
          <span class="nav-badge nav-badge-amber hidden" id="badge-review-count">0</span>
        </a>

        <a href="#schedule" class="nav-link" data-view="schedule" id="nav-d-schedule">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Schedule</span>
        </a>

        <a href="#feedback" class="nav-link" data-view="feedback" id="nav-d-feedback">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
          <span>Feedback Due</span>
          <span class="nav-badge nav-badge-purple hidden" id="badge-feedback-count">0</span>
        </a>

        <a href="#notes" class="nav-link" data-view="notes" id="nav-d-notes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span>Quick Notes</span>
          <span class="nav-badge hidden" id="badge-notes-count">0</span>
        </a>

        <a href="#library" class="nav-link" data-view="library" id="nav-d-library">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span>Content Library</span>
        </a>

        <div class="sidebar-divider"></div>

        <a href="#settings" class="nav-link" data-view="settings" id="nav-d-settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Doctor Profile</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-sm w-full btn-sample-data" id="btn-load-demo-sidebar" title="Populate realistic cardiology / clinic data">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          <span>Load Doctor Demo</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="app-main">
      
      <!-- Top Mobile / Global Header -->
      <header class="app-header" id="app-header">
        <div class="header-left">
          <div class="mobile-brand">
            <span class="mobile-brand-icon">
              <img class="content-mate-logo" src="Screenshot%202026-08-16%20105828.png" alt="Content Mate logo">
            </span>
            <span class="mobile-brand-title">Content Mate</span>
          </div>
          <div class="header-context">
            <span class="header-date" id="header-today-date">Friday, Aug 7</span>
            <h1 class="header-view-title" id="header-view-title">Today's Workspace</h1>
          </div>
        </div>

        <div class="header-right">
          <!-- Time Travel Test Helper -->
          <button class="btn btn-ghost btn-sm" id="header-btn-timetravel" title="Fast-forward system date +3 days (Testing Feedback Due)" style="color: var(--accent-purple); font-weight: 600; background: var(--accent-purple-subtle);">
            <span>⏩ +3 Days Test</span>
          </button>

          <!-- Quick Capture Actions in Header -->
          <button class="btn btn-secondary btn-sm" id="header-btn-note" title="Quick Thought">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            <span class="hide-mobile">Quick Note</span>
          </button>
          
          <button class="btn btn-primary btn-sm" id="header-btn-insight" title="Record New Insight">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Record Insight</span>
          </button>
        </div>
      </header>

      <!-- Scrollable Main View Container -->
      <main class="view-container" id="view-container">
        <!-- Dynamic Views will be injected here:
             - Dashboard (Today's action cards)
             - Script Review (Flashcard swiper)
             - Schedule (Calendar & unfilmed queue)
             - Feedback Due (3-day post metrics)
             - Notes (Quick thoughts + convert)
             - Content Library (Unified Insight timelines)
             - Settings (Doctor profile)
        -->
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Opening your workspace...</p>
        </div>
      </main>

      <!-- Mobile Bottom Navigation Bar -->
      <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
        <a href="#dashboard" class="bnav-item active" data-view="dashboard" id="bnav-dashboard">
          <div class="bnav-icon-wrapper">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
            <span class="bnav-badge hidden" id="bnav-badge-today">0</span>
          </div>
          <span>Today</span>
        </a>

        <a href="#review" class="bnav-item" data-view="review" id="bnav-review">
          <div class="bnav-icon-wrapper">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h20M2 6h20M2 18h20"/><circle cx="7" cy="6" r="2"/><circle cx="17" cy="12" r="2"/><circle cx="7" cy="18" r="2"/></svg>
            <span class="bnav-badge bnav-badge-amber hidden" id="bnav-badge-review">0</span>
          </div>
          <span>Review</span>
        </a>

        <!-- Floating Center Action Button for Mobile -->
        <button class="bnav-fab" id="bnav-fab-capture" aria-label="Record Insight">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>

        <a href="#schedule" class="bnav-item" data-view="schedule" id="bnav-schedule">
          <div class="bnav-icon-wrapper">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <span>Schedule</span>
        </a>

        <a href="#notes" class="bnav-item" data-view="notes" id="bnav-notes">
          <div class="bnav-icon-wrapper">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            <span class="bnav-badge hidden" id="bnav-badge-notes">0</span>
          </div>
          <span>Notes</span>
        </a>

        <a href="#settings" class="bnav-item" data-view="settings" id="bnav-settings" aria-label="Settings">
          <div class="bnav-icon-wrapper">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2m10-10h-2M4 12H2m17.07-7.07-1.41 1.41M6.34 17.66l-1.41 1.41m14.14 0-1.41-1.41M6.34 6.34 4.93 4.93"/></svg>
          </div>
          <span>Settings</span>
        </a>
      </nav>

    </div>
  </div>

  <!-- Global Modal Sheet Container (Bottom sheet on mobile, centered on desktop) -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal-card" id="modal-card">
      <div class="modal-drag-handle"></div>
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Modal Title</h3>
        <button class="btn-icon modal-close-btn" id="modal-close-btn" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Dynamic Modal Content -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- Standalone Application Script (Supports direct file:// double-click & HTTP) -->
  <script src="js/app.bundle.js"></script>
</body>
</html>
